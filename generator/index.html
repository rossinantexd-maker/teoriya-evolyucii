<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор Кометы</title>
<style>
  :root { --bg:#14110d; --panel:#1d1915; --line:#3a332b; --text:#efe7dc; --muted:#a89a88; --accent:#d4a574; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.4 "Segoe UI", system-ui, sans-serif; }
  .wrap { display:flex; height:100%; }
  #view { flex:1; position:relative; min-width:0; }
  #view canvas { display:block; width:100%; height:100%; }
  .hint { position:absolute; left:20px; bottom:16px; color:var(--muted); font-size:13px; }
  .title { position:absolute; left:20px; top:16px; }
  .title h1 { margin:0; font-size:22px; letter-spacing:.02em; }
  .title p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  aside { width:340px; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:18px 20px 24px; }
  h2 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:20px 0 4px; }
  h2:first-of-type { margin-top:4px; }
  .how { color:var(--muted); font-size:12px; margin:0 0 10px; }
  label { display:block; margin:10px 0 2px; font-size:14px; }
  label span { float:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  select { width:100%; background:#2a241e; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px; font:inherit; }
  .colors { display:flex; gap:12px; }
  .colors label { flex:1; }
  input[type=color] { width:100%; height:32px; border:1px solid var(--line); border-radius:6px; background:none; padding:2px; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  button { flex:1 1 auto; background:#2a241e; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font:inherit; cursor:pointer; }
  button.main { background:var(--accent); color:#1a140e; border-color:var(--accent); font-weight:600; }
  button:hover { filter:brightness(1.15); }
  #load { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); }
  @media (max-width:760px) { .wrap { flex-direction:column; } #view { height:55vh; flex:none; } aside { width:auto; border-left:none; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<div class="wrap">
  <div id="view">
    <div class="title"><h1>Генератор Кометы</h1><p>Каждый ползунок это ген. Грубая версия для команды.</p></div>
    <div id="load">Загружаю рыбу…</div>
    <div class="hint">Рыбу можно крутить пальцем или мышью и приближать</div>
  </div>
  <aside>
    <div class="btns">
      <button id="bOrig">Исходная Комета</button>
      <button id="bLaz">Лазурь</button>
      <button id="bRnd" class="main">Случайный малёк</button>
    </div>

    <h2>Плавники</h2>
    <p class="how">Размер задают кости</p>
    <label>Хвост <span id="vTail"></span></label><input type="range" id="tail" min="0.6" max="1.6" step="0.01" value="1">
    <label>Спинной <span id="vDors"></span></label><input type="range" id="dors" min="0.3" max="2" step="0.01" value="1">
    <label>Грудные <span id="vPect"></span></label><input type="range" id="pect" min="0.5" max="2.2" step="0.01" value="1">
    <label>Брюшные и анальный <span id="vLow"></span></label><input type="range" id="low" min="0.5" max="2" step="0.01" value="1">

    <h2>Голова и тело</h2>
    <p class="how">Форму задают морфы, от 0 до 100%</p>
    <label>Горб <span id="vHump"></span></label><input type="range" id="hump" min="0" max="1" step="0.01" value="0">
    <label>Жабры <span id="vGill"></span></label><input type="range" id="gill" min="0" max="1" step="0.01" value="0">
    <label>Глаза-телескопы <span id="vEyes"></span></label><input type="range" id="eyes" min="0" max="1" step="0.01" value="0">
    <label>Шапка на лбу <span id="vCap"></span></label><input type="range" id="cap" min="0" max="1" step="0.01" value="0">

    <h2>Окрас и узор</h2>
    <p class="how">Рисует материал</p>
    <label>Узор</label>
    <select id="pat">
      <option value="0">Родной окрас Кометы</option>
      <option value="1">Однотонная</option>
      <option value="2">Россыпь</option>
      <option value="3">Горошек</option>
      <option value="4">Лабиринт</option>
    </select>
    <div class="colors">
      <label>Тело<input type="color" id="cBody" value="#f0f0f2"></label>
      <label>Узор<input type="color" id="cPat" value="#e85a3c"></label>
    </div>
    <label>Блеск <span id="vGloss"></span></label><input type="range" id="gloss" min="0" max="1" step="0.01" value="0.4">
  </aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14110d);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(30, 80, 60); scene.add(key);
const camera = new THREE.PerspectiveCamera(30, 1, 1, 5000);
camera.position.set(-10, 15, 230);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-10, 0, 0); controls.enableDamping = true;

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const info = await (await fetch("kometa_info.json")).json();
const mn = new THREE.Vector3(...info.min), sz = new THREE.Vector3(...info.max).sub(mn);
const tl = new THREE.TextureLoader();
const rd = ["uzor_0080.png", "uzor_0220.png", "uzor_0400.png"].map(f => { const t = tl.load(f); t.colorSpace = THREE.NoColorSpace; t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping; return t; });

const U = {
  uPat: { value: 0 }, uRD: { value: rd[0] },
  uBody: { value: new THREE.Color() }, uPC: { value: new THREE.Color() },
  uMn: { value: mn }, uSz: { value: sz },
};

const gltf = await new GLTFLoader().loadAsync("kometa_gltf.json");
document.getElementById("load").remove();
const fish = gltf.scene; scene.add(fish);
let mesh, bones = {};
fish.traverse(o => {
  if (o.isSkinnedMesh || (o.isMesh && o.morphTargetInfluences)) mesh = o;
  if (o.isBone) bones[o.name] = o;
});
const mat = mesh.material;
mat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, U);
  sh.vertexShader = sh.vertexShader
    .replace("#include <common>", "#include <common>\nvarying vec3 vB;")
    .replace("#include <begin_vertex>", "#include <begin_vertex>\nvB = vec3(position.x, -position.z, position.y);");
  sh.fragmentShader = sh.fragmentShader
    .replace("#include <common>", `#include <common>
varying vec3 vB; uniform float uPat; uniform sampler2D uRD; uniform vec3 uBody; uniform vec3 uPC; uniform vec3 uMn; uniform vec3 uSz;`)
    .replace("#include <map_fragment>", `
vec3 t = texture2D(map, vMapUv).rgb;
float lum = (t.r + t.g + t.b) / 3.0;
float shade = lum * 0.95 + 0.25;
vec3 col = t;
if (uPat > 0.5) {
  vec3 g = (vB - uMn) / uSz;
  float fill = uPat > 1.5 ? smoothstep(0.35, 0.6, texture2D(uRD, vec2(g.x, g.z) * 1.8).r) : 0.0;
  col = mix(uBody * shade, uPC * shade, fill);
  float d = length(vec2(vB.x - 34.39, vB.z + 3.92));
  float em = (1.0 - smoothstep(1.6, 2.0, d)) * smoothstep(3.0, 4.2, abs(vB.y));
  col = mix(col, vec3(lum * 0.9), em);
}
diffuseColor *= vec4(col, 1.0);`);
};
mat.needsUpdate = true;

const dict = mesh.morphTargetDictionary || {};
const $ = id => document.getElementById(id);
const S = ["tail", "dors", "pect", "low", "hump", "gill", "eyes", "cap", "gloss"];
const V = { tail: "vTail", dors: "vDors", pect: "vPect", low: "vLow", hump: "vHump", gill: "vGill", eyes: "vEyes", cap: "vCap", gloss: "vGloss" };
const setScale = (names, s) => names.forEach(n => bones[n] && bones[n].scale.setScalar(s));

function apply() {
  const v = Object.fromEntries(S.map(k => [k, parseFloat($(k).value)]));
  setScale(["caudal_up_01", "caudal_dn_01"], v.tail);
  setScale(["caudal_up_06", "caudal_dn_06"], v.tail > 1 ? Math.max(0.5, 1 - (v.tail - 1) * 1.67) : 1);
  setScale(["dorsal_01"], v.dors);
  setScale(["pectoral_01_l", "pectoral_01_r"], v.pect);
  setScale(["anal", "pelvic_l", "pelvic_r"], v.low);
  for (const k of ["hump", "gill", "eyes", "cap"]) if (k in dict) mesh.morphTargetInfluences[dict[k]] = v[k];
  const p = parseInt($("pat").value);
  U.uPat.value = p; U.uRD.value = rd[Math.max(0, p - 2)];
  U.uBody.value.set($("cBody").value); U.uPC.value.set($("cPat").value);
  mat.roughness = 0.75 - v.gloss * 0.6; mat.metalness = v.gloss * 0.25;
  for (const k of S) {
    const x = v[k];
    $(V[k]).textContent = ["hump", "gill", "eyes", "cap", "gloss"].includes(k) ? Math.round(x * 100) + "%" : "×" + x.toFixed(2);
  }
}
S.forEach(k => $(k).addEventListener("input", apply));
["pat", "cBody", "cPat"].forEach(k => $(k).addEventListener("input", apply));

function preset(o) { for (const [k, x] of Object.entries(o)) $(k).value = x; apply(); }
const lin = (r, g, b) => "#" + new THREE.Color().setRGB(r, g, b).getHexString();
$("bOrig").onclick = () => preset({ tail: 1, dors: 1, pect: 1, low: 1, hump: 0, gill: 0, eyes: 0, cap: 0, pat: 0, gloss: 0.4 });
$("bLaz").onclick = () => preset({ tail: 1.3, dors: 1.6, pect: 1.75, low: 1.5, hump: 1, gill: 1, eyes: 1, cap: 1, pat: 4,
  cBody: lin(0.50, 0.84, 0.95), cPat: lin(0.03, 0.30, 0.88), gloss: 0.6 });
const r = (a, b) => a + Math.random() * (b - a);
const rare = (p) => Math.random() < p ? r(0.4, 1) : 0;
$("bRnd").onclick = () => {
  const h = Math.random();
  preset({ tail: r(0.8, 1.45).toFixed(2), dors: r(0.5, 1.8).toFixed(2), pect: r(0.7, 1.9).toFixed(2), low: r(0.7, 1.7).toFixed(2),
    hump: rare(0.3), gill: rare(0.3), eyes: rare(0.2), cap: rare(0.2), pat: 1 + Math.floor(Math.random() * 4),
    cBody: "#" + new THREE.Color().setHSL(h, 0.45, 0.82).getHexString(),
    cPat: "#" + new THREE.Color().setHSL((h + r(0.05, 0.5)) % 1, 0.85, 0.42).getHexString(), gloss: r(0.1, 0.8).toFixed(2) });
};
apply();

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
